name: Build Status

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
          os:
            - ubuntu-24.04
            - macos-14
            - windows-2022
          python-version:
            - "3.11"
          cibuildwheel:
            - "cp311"

